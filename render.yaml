# Render deployment (free plan). Render reads this file when you create a "Blueprint".
#
# Runs the upload page (consolidator/web.py). Free services sleep after 15 minutes with
# no visitors and take about a minute to wake up. Uploads and reports live in a temporary
# folder and are deleted after an hour (or when the service restarts).
services:
  - type: web
    name: factory-excel-consolidator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn consolidator.web:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PLANT_TZ
        value: Asia/Kolkata
